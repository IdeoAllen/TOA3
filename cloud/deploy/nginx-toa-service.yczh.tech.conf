# update.manifest_url: https://toa-service.yczh.tech/api/toa/releases/manifest?product=TOA3&channel=stable
# update.download_page: https://toa-service.yczh.tech/download/
# 安装包直链: https://toa-service.yczh.tech/download/TOA3-Setup-v{ver}.exe
