# TOA 云服务 — toa-service.yczh.tech
# 后端：uvicorn main:app --host 127.0.0.1 --port 8090（或 systemd toa-cloud）
# 证书：certbot certonly --nginx -d toa-service.yczh.tech

upstream toa_cloud_backend {
    server 127.0.0.1:8090;
    keepalive 8;
}

server {
    listen 80;
    server_name toa-service.yczh.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name toa-service.yczh.tech;

    ssl_certificate     /etc/letsencrypt/live/toa-service.yczh.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toa-service.yczh.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://toa_cloud_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /admin/ {
        proxy_pass http://toa_cloud_backend/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TOA3 下载页 + 安装包（唯一入口）：/opt/toa-cloud/download/
    #   index.html 读 manifest；TOA3-Setup-v{ver}.exe 由 sync_portal_installer.ps1 上传
    location = /download {
        return 301 /download/;
    }

    location /download/ {
        alias /opt/toa-cloud/download/;
        index index.html;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "public, max-age=300";
    }

    # 旧路径兼容（含 www.yczh.tech/downloads/ 的 301 链）
    location /downloads/ {
        rewrite ^/downloads/(.*)$ /download/$1 permanent;
    }

    location = / {
        return 302 /admin/;
    }
}

# TOA3 桌面配置（生产）
