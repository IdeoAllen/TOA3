<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- 主窗口背景 -->
  <rect width="1000" height="700" fill="#f0f0f0"/>
  
  <!-- 标题栏 -->
  <rect width="1000" height="60" fill="#1a237e"/>
  
  <!-- Logo和标题 -->
  <circle cx="40" cy="30" r="20" fill="#ffffff"/>
  <text x="70" y="25" font-family="Microsoft YaHei" font-size="14" font-weight="bold" fill="white">数字化运营助手</text>
  <text x="70" y="40" font-family="Arial" font-size="9" fill="#e0e0e0">DEOT</text>
  
  <!-- 标题栏右侧按钮 -->
  <text x="900" y="35" font-family="Arial" font-size="12" fill="white">当前用户: admin</text>
  <rect x="930" y="20" width="30" height="20" rx="5" fill="#1a237e" stroke="#ffffff"/>
  <text x="944" y="34" font-family="Arial" font-size="12" font-weight="bold" fill="white">S</text>
  <rect x="965" y="20" width="30" height="20" rx="5" fill="#1a237e" stroke="#ffffff"/>
  <text x="979" y="34" font-family="Arial" font-size="12" font-weight="bold" fill="white">i</text>
  <rect x="1000" y="20" width="30" height="20" rx="5" fill="#1a237e" stroke="#ffffff"/>
  <text x="1014" y="34" font-family="Arial" font-size="12" font-weight="bold" fill="white">X</text>
  
  <!-- 菜单栏 -->
  <rect width="1000" height="25" fill="#e0e0e0"/>
  <text x="10" y="17" font-family="Microsoft YaHei" font-size="10" fill="#333333">文件</text>
  <text x="60" y="17" font-family="Microsoft YaHei" font-size="10" fill="#333333">功能</text>
  <text x="110" y="17" font-family="Microsoft YaHei" font-size="10" fill="#333333">帮助</text>
  
  <!-- 标签页 -->
  <rect width="1000" height="30" fill="#d0d0d0"/>
  <rect x="10" y="85" width="80" height="30" fill="#d0d0d0"/>
  <text x="35" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">首页</text>
  <rect x="95" y="85" width="100" height="30" fill="#d0d0d0"/>
  <text x="115" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">目录检查工具</text>
  <rect x="200" y="85" width="100" height="30" fill="#d0d0d0"/>
  <text x="220" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">简历信息提取</text>
  <rect x="305" y="85" width="100" height="30" fill="#d0d0d0"/>
  <text x="325" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">班级日程提醒</text>
  <rect x="410" y="85" width="100" height="30" fill="#d0d0d0"/>
  <text x="430" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">批量文件夹生成</text>
  <rect x="515" y="85" width="100" height="30" fill="#d0d0d0"/>
  <text x="535" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">助教简历生成</text>
  <rect x="620" y="85" width="90" height="30" fill="#d0d0d0"/>
  <text x="665" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">通用生成工具</text>
  <rect x="715" y="85" width="100" height="30" fill="#d0d0d0"/>
  <text x="765" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">生成水印照片</text>
  <rect x="820" y="85" width="80" height="30" fill="#ffffff" stroke="#1a237e" stroke-width="2"/>
  <text x="860" y="105" font-family="Microsoft YaHei" font-size="12" fill="#1a237e">行转列工具</text>
  <rect x="905" y="85" width="80" height="30" fill="#d0d0d0"/>
  <text x="945" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">系统设置</text>
  
  <!-- 功能区内容 -->
  <rect x="10" y="115" width="980" height="545" fill="#ffffff"/>
  
  <!-- 左侧配置区域 -->
  <rect x="20" y="135" width="480" height="380" rx="5" fill="#f5f5f5"/>
  <text x="30" y="160" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#333333">Excel行转列配置</text>
  
  <!-- Excel文件选择 -->
  <text x="50" y="190" font-family="Microsoft YaHei" font-size="10" fill="#333333">选择Excel文件:</text>
  <rect x="120" y="180" width="300" height="25" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="130" y="197" font-family="Microsoft YaHei" font-size="10" fill="#333333">数据文件.xlsx</text>
  <rect x="430" y="180" width="60" height="25" rx="3" fill="#1a237e"/>
  <text x="440" y="197" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">浏览...</text>
  
  <!-- 工作表选择 -->
  <text x="50" y="220" font-family="Microsoft YaHei" font-size="10" fill="#333333">选择工作表:</text>
  <rect x="120" y="210" width="300" height="25" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="130" y="227" font-family="Microsoft YaHei" font-size="10" fill="#333333">Sheet1</text>
  <polygon points="410,215 420,225 400,225" fill="#333333"/>
  
  <!-- 列数据范围 -->
  <text x="50" y="250" font-family="Microsoft YaHei" font-size="10" fill="#333333">列数据范围:</text>
  <rect x="120" y="240" width="300" height="25" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="130" y="257" font-family="Microsoft YaHei" font-size="10" fill="#333333">A:A (姓名列)</text>
  
  <!-- 结果列标题 -->
  <text x="50" y="280" font-family="Microsoft YaHei" font-size="10" fill="#333333">结果列标题:</text>
  <rect x="120" y="270" width="300" height="25" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="130" y="287" font-family="Microsoft YaHei" font-size="10" fill="#333333">人员列表</text>
  
  <!-- 操作按钮 -->
  <rect x="150" y="310" width="100" height="30" rx="5" fill="#1a237e"/>
  <text x="200" y="330" font-family="Microsoft YaHei" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">预览数据</text>
  
  <rect x="270" y="310" width="100" height="30" rx="5" fill="#1a237e"/>
  <text x="320" y="330" font-family="Microsoft YaHei" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">开始转换</text>
  
  <!-- 转换选项 -->
  <rect x="50" y="350" width="18" height="18" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="75" y="363" font-family="Microsoft YaHei" font-size="10" fill="#333333">保留原始数据</text>
  
  <rect x="200" y="350" width="18" height="18" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="225" y="363" font-family="Microsoft YaHei" font-size="10" fill="#333333">自动排序</text>
  
  <rect x="330" y="350" width="18" height="18" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="355" y="363" font-family="Microsoft YaHei" font-size="10" fill="#333333">去重处理</text>
  
  <!-- 右侧预览区域 -->
  <rect x="510" y="135" width="470" height="380" rx="5" fill="#f5f5f5"/>
  <text x="520" y="160" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#333333">转换结果预览</text>
  
  <!-- 表格预览 -->
  <rect x="520" y="170" width="450" height="30" fill="#1a237e"/>
  <text x="535" y="190" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">列标题</text>
  <text x="635" y="190" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">行数据1</text>
  <text x="735" y="190" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">行数据2</text>
  <text x="835" y="190" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">行数据3</text>
  <text x="935" y="190" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">行数据4</text>
  
  <rect x="520" y="200" width="450" height="25" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="535" y="218" font-family="Microsoft YaHei" font-size="10" fill="#333333">人员列表</text>
  <rect x="610" y="200" width="360" height="25" fill="#f5f5f5" stroke="#d0d0d0"/>
  
  <rect x="520" y="225" width="450" height="25" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="635" y="243" font-family="Microsoft YaHei" font-size="10" fill="#333333">张三</text>
  
  <rect x="520" y="250" width="450" height="25" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="635" y="268" font-family="Microsoft YaHei" font-size="10" fill="#333333">李四</text>
  
  <rect x="520" y="275" width="450" height="25" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="635" y="293" font-family="Microsoft YaHei" font-size="10" fill="#333333">王五</text>
  
  <rect x="520" y="300" width="450" height="25" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="635" y="318" font-family="Microsoft YaHei" font-size="10" fill="#333333">赵六</text>
  
  <rect x="520" y="325" width="450" height="25" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="635" y="343" font-family="Microsoft YaHei" font-size="10" fill="#333333">孙七</text>
  
  <rect x="520" y="350" width="450" height="25" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="635" y="368" font-family="Microsoft YaHei" font-size="10" fill="#333333">周八</text>
  
  <rect x="520" y="375" width="450" height="25" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="635" y="393" font-family="Microsoft YaHei" font-size="10" fill="#333333">吴九</text>
  
  <!-- 状态栏 -->
  <rect width="1000" height="25" y="675" fill="#e0e0e0"/>
  <text x="10" y="690" font-family="Microsoft YaHei" font-size="10" fill="#333333">已选择文件: 数据文件.xlsx - 就绪</text>
  <text x="850" y="690" font-family="Microsoft YaHei" font-size="10" fill="#333333">版本 1.0.0</text>
  <text x="930" y="690" font-family="Microsoft YaHei" font-size="10" fill="#333333">2025-09-20 01:00:00</text>
</svg>