<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- 主窗口背景 -->
  <rect width="1000" height="700" fill="#f0f0f0"/>
  
  <!-- 标题栏 -->
  <rect width="1000" height="60" fill="#1a237e"/>
  
  <!-- Logo和标题 -->
  <circle cx="40" cy="30" r="20" fill="#ffffff"/>
  <text x="70" y="25" font-family="Microsoft YaHei" font-size="14" font-weight="bold" fill="white">数字化运营助手</text>
  <text x="70" y="40" font-family="Arial" font-size="9" fill="#e0e0e0">DEOT</text>
  
  <!-- 标题栏右侧按钮 -->
  <text x="900" y="35" font-family="Arial" font-size="12" fill="white">当前用户: admin</text>
  <rect x="930" y="20" width="30" height="20" rx="5" fill="#1a237e" stroke="#ffffff"/>
  <text x="944" y="34" font-family="Arial" font-size="12" font-weight="bold" fill="white">S</text>
  <rect x="965" y="20" width="30" height="20" rx="5" fill="#1a237e" stroke="#ffffff"/>
  <text x="979" y="34" font-family="Arial" font-size="12" font-weight="bold" fill="white">i</text>
  <rect x="1000" y="20" width="30" height="20" rx="5" fill="#1a237e" stroke="#ffffff"/>
  <text x="1014" y="34" font-family="Arial" font-size="12" font-weight="bold" fill="white">X</text>
  
  <!-- 菜单栏 -->
  <rect width="1000" height="25" fill="#e0e0e0"/>
  <text x="10" y="17" font-family="Microsoft YaHei" font-size="10" fill="#333333">文件</text>
  <text x="60" y="17" font-family="Microsoft YaHei" font-size="10" fill="#333333">功能</text>
  <text x="110" y="17" font-family="Microsoft YaHei" font-size="10" fill="#333333">帮助</text>
  
  <!-- 标签页 -->
  <rect width="1000" height="30" fill="#d0d0d0"/>
  <rect x="10" y="85" width="80" height="30" fill="#d0d0d0"/>
  <text x="35" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">首页</text>
  <rect x="95" y="85" width="100" height="30" fill="#d0d0d0"/>
  <text x="115" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">目录检查工具</text>
  <rect x="200" y="85" width="100" height="30" fill="#d0d0d0"/>
  <text x="220" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">简历信息提取</text>
  <rect x="305" y="85" width="100" height="30" fill="#d0d0d0"/>
  <text x="325" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">班级日程提醒</text>
  <rect x="410" y="85" width="100" height="30" fill="#d0d0d0"/>
  <text x="430" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">批量文件夹生成</text>
  <rect x="515" y="85" width="100" height="30" fill="#d0d0d0"/>
  <text x="535" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">助教简历生成</text>
  <rect x="620" y="85" width="90" height="30" fill="#d0d0d0"/>
  <text x="665" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">通用生成工具</text>
  <rect x="715" y="85" width="100" height="30" fill="#d0d0d0"/>
  <text x="765" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">生成水印照片</text>
  <rect x="820" y="85" width="80" height="30" fill="#d0d0d0"/>
  <text x="860" y="105" font-family="Microsoft YaHei" font-size="12" fill="#333333">行转列工具</text>
  <rect x="905" y="85" width="90" height="30" fill="#ffffff" stroke="#1a237e" stroke-width="2"/>
  <text x="950" y="105" font-family="Microsoft YaHei" font-size="12" fill="#1a237e">文档合成器</text>
  
  <!-- 功能区内容 -->
  <rect x="10" y="115" width="980" height="545" fill="#ffffff"/>
  
  <!-- 上方操作区域 -->
  <rect x="20" y="135" width="960" height="100" rx="5" fill="#f5f5f5"/>
  <text x="30" y="160" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#333333">文档合成设置</text>
  
  <!-- 源文档选择 -->
  <text x="50" y="190" font-family="Microsoft YaHei" font-size="10" fill="#333333">添加源文档:</text>
  <rect x="120" y="180" width="300" height="25" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="130" y="197" font-family="Microsoft YaHei" font-size="10" fill="#999999">未选择文件</text>
  <rect x="430" y="180" width="80" height="25" rx="3" fill="#1a237e"/>
  <text x="450" y="197" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">添加文件</text>
  
  <rect x="520" y="180" width="80" height="25" rx="3" fill="#1a237e"/>
  <text x="540" y="197" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">添加文件夹</text>
  
  <rect x="610" y="180" width="80" height="25" rx="3" fill="#1a237e"/>
  <text x="630" y="197" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">移除所选</text>
  
  <!-- 合成选项 -->
  <rect x="700" y="180" width="80" height="25" rx="3" fill="#4caf50"/>
  <text x="720" y="197" font-family="Microsoft YaHei" font-size="10" font-weight="bold" fill="#ffffff">开始合成</text>
  
  <!-- 左侧文档列表 -->
  <rect x="20" y="245" width="480" height="270" rx="5" fill="#f5f5f5"/>
  <text x="30" y="270" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#333333">待合成文档列表</text>
  
  <!-- 文档列表预览 -->
  <rect x="30" y="280" width="460" height="220" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  
  <!-- 列表标题 -->
  <rect x="30" y="280" width="460" height="20" fill="#e0e0e0"/>
  <text x="40" y="294" font-family="Microsoft YaHei" font-size="10" font-weight="bold" fill="#333333">文件名</text>
  <text x="350" y="294" font-family="Microsoft YaHei" font-size="10" font-weight="bold" fill="#333333">大小</text>
  <text x="420" y="294" font-family="Microsoft YaHei" font-size="10" font-weight="bold" fill="#333333">顺序</text>
  
  <!-- 文档条目 -->
  <rect x="30" y="300" width="460" height="25" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="40" y="318" font-family="Microsoft YaHei" font-size="10" fill="#333333">文档1.docx</text>
  <text x="350" y="318" font-family="Microsoft YaHei" font-size="10" fill="#333333">1.2MB</text>
  <rect x="420" y="303" width="50" height="19" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="445" y="316" font-family="Microsoft YaHei" font-size="10" fill="#333333">1</text>
  <polygon points="465,308 475,318 455,318" fill="#333333"/>
  
  <rect x="30" y="325" width="460" height="25" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="40" y="343" font-family="Microsoft YaHei" font-size="10" fill="#333333">文档2.docx</text>
  <text x="350" y="343" font-family="Microsoft YaHei" font-size="10" fill="#333333">856KB</text>
  <rect x="420" y="328" width="50" height="19" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="445" y="341" font-family="Microsoft YaHei" font-size="10" fill="#333333">2</text>
  <polygon points="465,333 475,343 455,343" fill="#333333"/>
  
  <rect x="30" y="350" width="460" height="25" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="40" y="368" font-family="Microsoft YaHei" font-size="10" fill="#333333">文档3.docx</text>
  <text x="350" y="368" font-family="Microsoft YaHei" font-size="10" fill="#333333">2.1MB</text>
  <rect x="420" y="353" width="50" height="19" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="445" y="366" font-family="Microsoft YaHei" font-size="10" fill="#333333">3</text>
  <polygon points="465,358 475,368 455,368" fill="#333333"/>
  
  <!-- 右侧合成设置 -->
  <rect x="510" y="245" width="470" height="270" rx="5" fill="#f5f5f5"/>
  <text x="520" y="270" font-family="Microsoft YaHei" font-size="12" font-weight="bold" fill="#333333">合成选项</text>
  
  <!-- 输出设置 -->
  <text x="540" y="300" font-family="Microsoft YaHei" font-size="10" fill="#333333">输出文件类型:</text>
  <rect x="630" y="290" width="120" height="25" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="640" y="307" font-family="Microsoft YaHei" font-size="10" fill="#333333">Word文档(.docx)</text>
  <polygon points="735,295 745,305 725,305" fill="#333333"/>
  
  <text x="540" y="330" font-family="Microsoft YaHei" font-size="10" fill="#333333">输出文件名:</text>
  <rect x="630" y="320" width="300" height="25" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="640" y="337" font-family="Microsoft YaHei" font-size="10" fill="#333333">合成文档_20250920.docx</text>
  
  <text x="540" y="360" font-family="Microsoft YaHei" font-size="10" fill="#333333">输出目录:</text>
  <rect x="630" y="350" width="240" height="25" rx="3" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="640" y="367" font-family="Microsoft YaHei" font-size="10" fill="#333333">桌面/合成文档</text>
  <rect x="870" y="350" width="60" height="25" rx="3" fill="#1a237e"/>
  <text x="880" y="367" font-family="Microsoft YaHei" font-size="10" fill="#ffffff">浏览</text>
  
  <!-- 高级选项 -->
  <text x="540" y="390" font-family="Microsoft YaHei" font-size="10" font-weight="bold" fill="#333333">高级选项</text>
  
  <rect x="540" y="410" width="18" height="18" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="565" y="423" font-family="Microsoft YaHei" font-size="10" fill="#333333">保留原始样式</text>
  
  <rect x="670" y="410" width="18" height="18" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="695" y="423" font-family="Microsoft YaHei" font-size="10" fill="#333333">自动生成目录</text>
  
  <rect x="820" y="410" width="18" height="18" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="845" y="423" font-family="Microsoft YaHei" font-size="10" fill="#333333">添加封面页</text>
  
  <rect x="540" y="440" width="18" height="18" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="565" y="453" font-family="Microsoft YaHei" font-size="10" fill="#333333">合并相同样式</text>
  
  <rect x="670" y="440" width="18" height="18" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="695" y="453" font-family="Microsoft YaHei" font-size="10" fill="#333333">保持页眉页脚</text>
  
  <!-- 状态栏 -->
  <rect width="1000" height="25" y="675" fill="#e0e0e0"/>
  <text x="10" y="690" font-family="Microsoft YaHei" font-size="10" fill="#333333">已添加3个文档，准备合成</text>
  <text x="850" y="690" font-family="Microsoft YaHei" font-size="10" fill="#333333">版本 1.0.0</text>
  <text x="930" y="690" font-family="Microsoft YaHei" font-size="10" fill="#333333">2025-09-20 01:00:00</text>
</svg>