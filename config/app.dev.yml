auth:
  skip_login: true
  default_user: 赵成
  default_role: user
  allow_empty_password: true
license:
  check_cache_minutes: 10
  service_url: http://127.0.0.1:8090/api/toa-license
  dms_base_url: https://dms.yczh.tech
  offline_grace_days: 2
  dev_grant_all: false
update:
  enabled: true
  timeout_seconds: 3
  manifest_url: http://127.0.0.1:8090/api/toa/releases/manifest?product=TOA3&channel=stable
  download_page: http://127.0.0.1:8090/admin/
log_config:
  log_level: INFO
hotkeys:
  close_to_background: true
  enable_screenshot: true
  exit_app: Ctrl+Q
  restart_app: Ctrl+Shift+R
  open_about: Alt+Shift+O
  open_settings: Alt+S
  open_home: Ctrl+H
  open_notepad: Alt+N
  open_pomodoro: Alt+P
  open_ocr: Alt+O
  open_clipboard: Alt+Shift+C
  home_jump_office: K
  home_jump_image: I
  screenshot: Alt+A
  screenshot_region: Alt+Shift+A
  summon_module_id: deduction_note_formatter
  toggle_fullscreen: F11
  toggle_window: none
window:
  theme: dms_green
  default_fullscreen: true
  default_start_tab: home
