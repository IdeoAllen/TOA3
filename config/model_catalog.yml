# 能力 → 多模型配置（密钥存本机用户私密配置 profiles，勿写入安装包）
# 用户覆盖：data/user/model_catalog.yml（active + 自定义 profile）
capabilities:
  text_llm:
    label: 文本大模型
    default_profile: moonshot_kimi
    profiles:
      moonshot_kimi:
        label: Moonshot · Kimi K2.6
        region: cn
        vendor: Moonshot
        provider: openai_compatible
        api_base: https://api.moonshot.cn/v1
        model: kimi-k2.6
        temperature: 0.3
        model_fallbacks: []
      deepseek:
        label: DeepSeek · Chat
        region: cn
        vendor: DeepSeek
        provider: openai_compatible
        api_base: https://api.deepseek.com/v1
        model: deepseek-chat
        temperature: 0.3
        model_fallbacks: []
      ollama_local:
        label: 本地 Ollama（OpenAI 协议）
        region: local
        vendor: Ollama
        origin: local
        provider: openai_compatible
        api_base: http://127.0.0.1:11434/v1
        model: llama3.2
        temperature: 0.3
        model_fallbacks: []
  image_gen:
    label: 图像生成
    # 小白默认：本机简易（装好权重后可用）；未装时任务页引导安装
    default_profile: local_z_image_simple
    profiles:
      local_z_image_simple:
        label: 本机生图（推荐）
        region: local
        vendor: 本机 SDCPP
        origin: local
        tier: simple
        provider: sdcpp
        model: z_image_turbo
        steps: 8
        cfg_scale: 1.0
        offload_to_cpu: true
        note: 零工作流；导入离线包或按指引安装后可用
      comfyui_z_image_turbo:
        label: ComfyUI 专业 · Z-Image
        region: local
        vendor: ComfyUI
        origin: local
        tier: advanced
        provider: comfyui
        api_base: http://127.0.0.1:8188
        # 默认走本机常见 safetensors；无对应文件时自动探测 / 回落 GGUF
        workflow: z_image_unet
        unet: z_image_turbo_bf16.safetensors
        text_encoder: qwen_3_4b.safetensors
        vae: ae.safetensors
        steps: 8
        cfg_scale: 1.0
        note: 对接本机 ComfyUI 的 Z-Image（自动匹配已安装模型文件名）
      comfyui_local:
        label: ComfyUI 专业 · 自动匹配
        region: local
        vendor: ComfyUI
        origin: local
        tier: advanced
        provider: comfyui
        api_base: http://127.0.0.1:8188
        workflow: auto
        model: ""
        steps: 20
        note: 自动选用本机 checkpoint 或 Z-Image；与 ComfyUI 界面已能出图的模型一致
      local_sd_webui:
        label: 本地 SD WebUI / Forge
        region: local
        vendor: SD WebUI
        origin: local
        tier: advanced
        provider: sd_webui
        api_base: http://127.0.0.1:7860
        model: ""
        steps: 20
        note: 需先启动 WebUI/Forge 并开启 API（--api）
      openai_images:
        label: 云端生图 · OpenAI
        region: intl
        vendor: OpenAI
        origin: cloud
        tier: cloud
        provider: openai_images
        api_base: https://api.openai.com/v1
        model: dall-e-3
        size: 1024x1024
        note: 需联网与 API Key
      doubao_seedream:
        label: 豆包 · Seedream 5.0 Pro
        region: cn
        vendor: 火山方舟
        origin: cloud
        tier: cloud
        provider: openai_images
        api_base: https://ark.cn-beijing.volces.com/api/v3
        model: doubao-seedream-5-0-pro-260628
        size: 2K
        response_format: url
        watermark: false
        supports_edit: true
        note: 火山方舟文生图 / 参考图编辑；Key 存本机，勿写入仓库
      evolink_grok_imagine:
        label: Grok Imagine 2.0 · Evolink
        region: intl
        vendor: Evolink
        origin: cloud
        tier: cloud
        provider: evolink_images
        api_base: https://api.evolink.ai/v1
        model: grok-imagine-image-2.0
        resolution: 2K
        quality: medium
        supports_edit: true
        note: 约 $0.03/张起；文生图与 1～3 张参考图编辑同模型 ID；可与 Seedance 共用 Evolink Key
      mxapi_nano_banana_2:
        label: Nano Banana 2 · MXAPI
        region: cn
        vendor: MXAPI
        origin: cloud
        tier: cloud
        provider: openai_images
        api_base: https://open.mxapi.org/v1
        model: nano-banana-2
        size: 1024x1024
        note: 约 ¥0.20/张；OpenAI 兼容生图；Key 可复用 Harness MXAPI_API_KEY；余额查 /api/v2/points
      mxapi_gpt_image_2:
        label: GPT Image 2 · MXAPI
        region: cn
        vendor: MXAPI
        origin: cloud
        tier: cloud
        provider: openai_images
        api_base: https://open.mxapi.org/v1
        model: gpt-image-2
        size: 1024x1024
        note: 约 ¥0.10/张；同模型比 Evolink 更便宜；Key 与 Nano Banana 共用
      mxapi_nano_banana_pro:
        label: Nano Banana Pro · MXAPI
        region: cn
        vendor: MXAPI
        origin: cloud
        tier: cloud
        provider: openai_images
        api_base: https://open.mxapi.org/v1
        model: nano-banana-pro
        size: 1024x1024
        note: 约 ¥0.20/张；高要求成品；Key 与其它 MXAPI 共用
  video_gen:
    label: 视频生成
    default_profile: evolink_seedance_2
    profiles:
      evolink_seedance_2:
        label: Seedance 2.0 · Evolink
        region: intl
        vendor: Evolink
        origin: cloud
        tier: cloud
        provider: evolink_seedance
        api_base: https://api.evolink.ai/v1
        model: seedance-2.0-text-to-video
        model_txt: seedance-2.0-text-to-video
        model_img: seedance-2.0-image-to-video
        aspect_ratio: adaptive
        quality: 720p
        duration: 5
        generate_audio: true
        content_filter: true
        note: Evolink 统一 Key；生成链接 24h 有效，请及时保存到本机 output
      doubao_seedance:
        label: 豆包 · Seedance 1.5 Pro
        region: cn
        vendor: 火山方舟
        origin: cloud
        tier: cloud
        provider: volcengine_seedance
        api_base: https://ark.cn-beijing.volces.com/api/v3
        model: doubao-seedance-1-5-pro-251215
        ratio: "16:9"
        resolution: 720p
        duration: 5
        watermark: false
        generate_audio: false
        note: 文生视频 / 首帧图生视频；可与 Seedream 共用 Ark Key