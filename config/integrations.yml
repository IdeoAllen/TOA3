dms:
  enabled: true
  base_url: https://dms.yczh.tech
  timeout_seconds: 30
  license_paths:
    activate: /api/toa-license/activate
    check: /api/toa-license/check
    sync: /api/toa-license/sync
    reconcile: /api/toa-license/reconcile
  release_note: 发版与后端 deploy 遵守工作区 dms-release-deploy 规则
email:
  enabled: false
  smtp_server: ''
  port: 587
  use_tls: true
  config_file: ./config/email/email_config.txt
ocr:
  enabled: true
  provider: tesseract
  tesseract_path: C:\Program Files\Tesseract-OCR\tesseract.exe
  lang: chi_sim+eng
  note: 图片/扫描件 OCR；简历提取默认 chi_sim+eng；业务经 OcrClient 调用
llm:
  enabled: true
  provider: openai_compatible
  api_base: http://127.0.0.1:11434/v1
  model: llama3.2
  note: 摘要、改写；多配置见 model_catalog
  temperature: 0.3
  model_fallbacks:
  - kimi-k2.5
  - moonshot-v1-8k
  - kimi-k3
image_gen:
  enabled: true
  provider: catalog
  timeout_seconds: 180
  note: 文生图；模型在 model_catalog · 图像生成；含豆包 Seedream 云端与本机/ComfyUI
video_gen:
  enabled: true
  provider: catalog
  timeout_seconds: 600
  note: 视频生成；火山方舟 Seedance；异步任务轮询
watermark_ai:
  enabled: true
  provider: local_lama
  note: 本地 LaMa 可选增强；默认业务走轻量修复，低配无需装权重/GPU
tencent_docs:
  enabled: false
  provider: tencent
  base_url: ''
  timeout_seconds: 30
  note: 腾讯文档 OAuth/API 占位；业务经 get_client("tencent_docs") 调用，密钥用环境变量
dingtalk:
  enabled: false
  webhook_url: ''
  note: 预留，统一经 integrations 层对接
wechat:
  enabled: false
  note: 截图/剪贴板能力本地实现，不经远程 API
