# 产品方案（SKU）— 当前仅保留「全功能方案」可售；pack_id = plan_id（历史 id=tiyan）
# 用户档位展示见 services/user_plan_presentation（基础版/体验版/授权版/正式版）
# 授权码 / 订单 features 可写 menu_id、pack_id 或 all
# 扩展开发说明见 docs/architecture/ARCH-07-用户扩展范式.md

packs:
  tiyan:
    name: 全功能方案
    desc: TOA 唯一产品方案；试用与购买均走此方案，含全部付费模块。勿再对外称「体验版」（体验版=试用档位）。
    sellable: true
    validity_days: 365
    features:
      - all

  # 扩展开发能力（可单独挂订单 features；与 harness_agent 常一起卖）
  extension_studio:
    name: 扩展开发
    desc: 「系统→扩展」自建业务（feature_id=user_extensions）；沙箱与发版见 docs/architecture/28
    sellable: false
    validity_days: 365
    features:
      - user_extensions
      - harness_agent

  # 单机免费层（不联网；登录「进入软件」入口，非本方案售卖）
  local_free:
    name: 单机基础版
    desc: 装完即用；离线本地小工具
    sellable: false
    features:
      - home
      - system_settings
      - notifications
      - job_scheduler
      - quick_notepad
      - pomodoro
      - screenshot_tool
      - clipboard_history
      - quadrant_tasks
      - llm_assistant
      - harness_agent
