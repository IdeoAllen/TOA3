      - deliverables/poxiao.pptx
  image_creator: {}
  image_adjust: {}
  image_watermark: {}
  image_format_convert: {}
  image_to_scan: {}
  watermark_photo_generator: {}
  watermark_remover: {}
  photo_extractor: {}
  ocr_tool: {}
  llm_assistant: {}
  harness_agent: {}
  engine_host_hub: {}
  open_pencil: {}
  drawio_web: {}
  comfyui_web: {}
  # 用户业务插件数据仍走 module_data_dir(<plugin_id>)；样例见 assets/samples/toa_plugin_pack/
  media_studio: {}
  quick_notepad: {}
  web_workspace: {}
  quadrant_tasks: {}
  pomodoro: {}
  screenshot_tool: {}
  clipboard_history: {}
  email_client: {}
  batch_rename: {}
  directory_generator: {}
  directory_inspector: {}
