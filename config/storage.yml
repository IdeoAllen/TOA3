# TOA3 存储布局（逻辑路径 → 物理目录）
# 根目录键与 config paths 对齐，由 services/storage_paths 解析

roots:
  bundled: assets          # 随仓库/安装包分发（只读）
  data: ./data             # 用户与模块运行时数据（可写，gitignore）
  output: ./output         # 生成结果（可写，gitignore）
  cache: ./cache           # 临时文件（可写，gitignore）

layout:
  # assets 下
  templates_bundled: templates
  samples: samples
  # data 下
  module_data: module
  shared_data: shared
  user_templates: user/templates
  # output 下：{module_id}/{yyyy_mm}/
  module_output_pattern: "{module_id}/{yyyy_mm}"

# 模块登记：模板与示例（相对 templates_bundled / samples 子路径）
# 未列出的模块仍可用 module_data_dir / module_output_dir 默认约定
modules:
  table_card_generator:
    templates:
      - business/table_card.pptx
    samples:
      - modules/table_card_generator/demo_class.txt
  teaching_assistant_resume:
    templates:
      - business/resume.pptx
    samples:
      - modules/teaching_assistant_resume/demo_resume.txt
  assistant_recruit_post:
    samples:
      - modules/assistant_recruit_post/demo_input.txt
  assistant_outfit_swap: {}
  generic_generator_simple:
    templates:
