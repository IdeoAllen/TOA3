email:
  password: ''
  port: 587
  recipient_email: ''
  sender_email: ''
  smtp_server: ''
export_config:
  export_timeout: '60'
  max_export_history: '50'
  temp_file_expiry: '24'
font:
  font_family: ''
  font_size: ''
  header_font_size: ''
home_page:
  keep_config_file: true
  show_gallery: false
  show_heart: false
  show_team_image: false
  use_canvas_home: false
hotkeys:
  close_to_background: true
  enable_global_toggle: true
  enable_screenshot: true
  exit_app: Ctrl+Q
  restart_app: Ctrl+Shift+R
  open_about: Alt+Shift+O
  open_settings: Alt+S
  open_home: Ctrl+H
  open_notepad: Alt+N
  open_pomodoro: Alt+P
  open_ocr: Alt+O
  open_clipboard: Alt+Shift+C
  open_harness_agent: Alt+Shift+H
  # 页内（仅首页）：办公 / 图片分组跳转
  home_jump_office: K
  home_jump_image: I
  screenshot: Alt+A
  # 配置键名历史遗留：实际为「全屏截图」，不是区域
  screenshot_region: Alt+Shift+A
  summon_module_id: deduction_note_formatter
  toggle_fullscreen: F11
  # Double+Ctrl 无法被 RegisterHotKey / QKeySequence 解析，保留作占位；生效请改成 Alt+… / Ctrl+…
  toggle_window: none
  module_shortcuts: {}
license:
  check_cache_minutes: 10
  activate_timeout_seconds: 15
  # 目标：TOA 云服务（授权/试用/订单），与 DMS 无强绑定
  service_url: https://toa-service.yczh.tech/api/toa-license
  # 过渡：未部署 TOA 云服务前 fallback；迁移完成后删除
  dms_base_url: https://dms.yczh.tech
  offline_grace_days: 2
update:
  enabled: true
  timeout_seconds: 3
  manifest_url: https://toa-service.yczh.tech/api/toa/releases/manifest?product=TOA3&channel=stable
  download_page: https://www.yczh.tech/downloads/
log_config:
  enable_console_log: true
  log_format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  log_level: DEBUG
  log_rotation: daily
  max_log_files: '7'
