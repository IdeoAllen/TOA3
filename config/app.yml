  status_bar_bg: ''
  status_bar_fg: ''
  text_color: ''
data_paths:
  data_dir: ./data
  deliverable_template_lixiao: ./templates/利刃交付材料模版.pptx
  deliverable_template_poxiao: ./templates/破晓交付材料模版.pptx
