  author: 大成哥
  author_email: chengchengzhao@eautosh.com
  brand_abbreviation: TOA
  brand_alias: 运营宝
  brand_name: 运营宝 · 桌面办公套件
  brand_name_en: TOA — Desktop Office Suite
  slogan: 打开就能用 · 用完不想换
  slogan_subtitle: 少点一下，多干一件事——剪贴板、截图、记事与文件一站集成，培训业务也能顺手做完
brand_and_system:
  app_logo_path: avatars/logo.png
  app_version: 3.0.0  # 已废弃：运行时以 app/version.py APP_VERSION 为准，勿在此处发版
  author: 大成哥
  author_email: chengchengzhao@eautosh.com
  brand_abbreviation: TOA
  brand_alias: 运营宝
  brand_name: 运营宝 · 桌面办公套件
  brand_name_en: TOA — Desktop Office Suite
  slogan: 打开就能用 · 用完不想换
  slogan_subtitle: 少点一下，多干一件事——剪贴板、截图、记事与文件一站集成，培训业务也能顺手做完
color:
  header_bg_color: ''
  status_bar_bg: ''
  status_bar_fg: ''
  text_color: ''
data_paths:
  data_dir: ./data
  deliverable_template_lixiao: ./templates/利刃交付材料模版.pptx
  deliverable_template_poxiao: ./templates/破晓交付材料模版.pptx
  docs_dir: ./docs
  email_config: '{{base_dir}}/config/email/email_config.txt'
  images_dir: ./images
  knowledge_base: '{{base_dir}}/data/knowledge_base.json'
  license_file: ./config/license.json
  log_dir: ./common/logs
  output_dir: ./output
  resume_template: ./templates/简历模版.pptx
  table_card_template: ./templates/台卡模板.pptx
  template_dir: ./templates
  user_config_file: ./config/app.yml
  winform_dir: .
email:
  password: ''
  port: 587
  recipient_email: ''
  sender_email: ''
  smtp_server: ''
export_config:
  export_timeout: '60'
  max_export_history: '50'
  temp_file_expiry: '24'
font:
  font_family: ''
  font_size: ''
  header_font_size: ''
home_page:
  keep_config_file: true
  show_gallery: false
  show_heart: false
  show_team_image: false
  use_canvas_home: false
hotkeys:
  close_to_background: true
  tray_modules:
    - quick_notepad
    - clipboard_history
    - screenshot_tool
    - quadrant_tasks
    - ocr_tool
    - harness_agent
  enable_global_toggle: true
  enable_screenshot: true
  exit_app: Ctrl+Q
  restart_app: Ctrl+Shift+R
  open_about: Alt+Shift+O
  switch_user: Alt+U
  open_settings: Alt+S
  open_home: Ctrl+H
  open_notepad: Alt+N
  open_pomodoro: Alt+P
  open_ocr: Alt+O
  open_clipboard: Alt+Shift+C
  open_harness_agent: Alt+Shift+H
  # 页内（仅首页）：办公 / 图片分组跳转
  home_jump_office: K
  home_jump_image: I
  screenshot: Alt+A
  # 配置键名历史遗留：实际为「全屏截图」，不是区域
  screenshot_region: Alt+Shift+A
  summon_module_id: deduction_note_formatter
  toggle_fullscreen: F11
  # 双击 Ctrl 唤起主窗（低级别键盘监听；托盘隐藏时仍可用）
  toggle_window: Double+Ctrl
  module_shortcuts:
    quadrant_tasks: Alt+T
license:
  check_cache_minutes: 10
  activate_timeout_seconds: 15
  # 目标：TOA 云服务（授权/试用/订单），与 DMS 无强绑定
  service_url: https://toa-service.yczh.tech/api/toa-license
  # 过渡：未部署 TOA 云服务前 fallback；迁移完成后删除
  dms_base_url: https://dms.yczh.tech
  offline_grace_days: 2
  # 登录「进入软件」离线基础版时长（天）；到期后提示升级 upgrade_target_label
  standalone_experience_days: 30
  upgrade_target_label: 正式版
update:
  enabled: true
  timeout_seconds: 3
  check_on_startup: true
  manifest_url: https://toa-service.yczh.tech/api/toa/releases/manifest?product=TOA3&channel=stable
  download_page: https://www.yczh.tech/downloads/
log_config:
  enable_console_log: true
  log_format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  log_level: DEBUG
  log_rotation: daily
  max_log_files: '7'
