# DeepSeek Harness Sidecar（本地 Agent · 非 integrations HTTP）
# 个人路径与开关：开发写 data/user/harness.yml；正式版写 %LOCALAPPDATA%\YCZH-TOA3\config\harness.yml
# 发版模板 packaging/shipped_config/harness.yml 须与下列行为字段保持一致（enabled/auto_start/browser/3082）

harness:
  # 默认空路径；未覆盖时进页走四步开用（选版本 → 等待 → Key → 检测启动）。
  # 勿绑 WorkBuddy/.dsh（由运行时自愈迁到 ~/.toa3/harness-runtime/.dsh）
  enabled: true
  dsh_home: ""
  node_exe: ""
  dsh_bin: ""
  web_port: 3082
  dshm_port: 8787
  auto_start: true
  stop_on_app_exit: false
  clear_env_api_key: true
  dshm_script: vendor/dshm/bin/dshm.js
  default_workspace: ""
  surface_mode: embed
  web_zoom: 1.0
  web_readability_boost: false
  theme_harmonize: false
  feed_auto_inject: false
  # 双路线预制包：bundle 钉扎 0.1.5-rc.1.1（CDN zip）；dsh 内核 npm 仍为 0.1.5-rc.1（见 harness_setup.DSH_PINNED_VERSION）
  official_bundle_url: https://www.yczh.tech/downloads/harness-official-0.1.5-rc.1.1.zip
  official_sha256: 0d655f2ee47684fcbb54c0bac0454545ab074d48839c3a8cea1087dfb89fe3af
  official_bundle_version: "0.1.5-rc.1.1"
  official_size_hint_mb: 459
  prefab_bundle_url: https://www.yczh.tech/downloads/harness-prefab-0.1.5-rc.1.1.zip
  prefab_sha256: 8b50ba656873e64eabe0ce54940b2aac8b2c07336e1f81118f50c08cc87fafdb
  prefab_bundle_version: "0.1.5-rc.1.1"
  prefab_size_hint_mb: 459
  # 预制必备插件白名单（首轮空=与官方同核；主理人后续补包名，禁 boot-killer）
  prefab_essential_plugins: []
  cost_currency: 元
  cost_input_per_million: 2
  cost_output_per_million: 8
  quick_prompts:
    - label: 去做扩展
      text: >-
        请引导用户去 TOA 创建扩展，不要改占位脚本、不要二次编辑超长提示词。
        入口：顶栏「系统」→「扩展」→「自定义插件」；必填名称 + 需求描述（场景/痛点/作用）；
        点「创建并去开发」后自动投喂 skill「toa3-sop-user-extension」。
        若用户已在聊天写了需求，复述要点并请其到扩展页粘贴后创建。
    - label: 读架构
      text: 请阅读当前工作区目录结构，按 modules/services/app 分层总结职责与入口。
    - label: 最小修复
      text: 根据下列现象做根因分析，给出最小 diff 修复方案（先说明再改）：
