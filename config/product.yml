# TOA3 产品定位（愿景公示 · UI 与文档同源）

vision:
  # 对外使命（首页 / 关于首屏 · 不是「口号」）
  tagline: 办公极简伴侣 · 少点一下，多干一件事
  mission_label: 使命
  # 愿景（我们要去哪）
  statement: 让办公人员感到极致简便——打开就能用，用完不想换别的软件。
  # 目标（我们要成为谁）
  goal: 成为办公室工作人员最爱、最方便、最离不开的桌面办公软件。
  # 集成定位（首页精简条）
  integration: 每个能力都对标市面同类工具；我们只是集成到一处，免去到处找——绝对不能比同类差，否则就是败笔。
  # 套件定位（安装叙事 · 与壳层规则同源）
  suite_positioning: 办公室人员安装本软件，即等于集成剪贴板、截图、目录、文件、桌面、业务等常用办公效率工具——一站替代多软件来回切换。
  # 命名
  naming_note: 正式俏皮名稍后共创；现阶段以「运营宝 / TOA」示人，先把每天离不开的体验做实。
  audience: 培训运营、教务、行政与通用白领
  promises:
    - 高频刚需做强，不做功能凑数；每项对标品类头部，宁少勿滥
    - 同类能力一站集成，少「到处找软件」
    - 键位跟手、步骤尽量少
    - 本地优先、可离线，结果在本机可追溯
    - 截图、记事、剪贴板等日常动作一站直达
  principles:
    - 每个功能在市面上都能找到对应工具；TOA 做集成与一致体验，能力不输头部
    - 高频小工具聚合，减少「到处找软件」
    - 键位跟手：全局少而精，页内好记
    - 本地优先、可离线、数据在 data/output 可追溯
    - 三方能力经 integrations 统一接入
    - 业务页只从 widgets 控件库出 UI
    - 图标必须清晰：禁止模糊、锯齿（HiDPI 矢量光栅化规范）

module_groups:
  # 顶栏一级 = 子模块（子系统）；侧栏二级 = 功能模块（见 shell 术语表）
  home: 首页与导航
  office: 办公增效（记事、番茄钟、截图、图片转文字、剪贴板等）
  ai: AI 智能体（Harness 编码智能体 / 大模型助手）
  image: 图片处理
  directory: 文件与目录
  file: 办公文件与表格
  business: 培训业务
  system: 系统与控件库

roadmap:
  p0_done:
    - 主壳 / 主题 / 控件库 / 授权 DMS / 门禁 / 托盘 / 全局热键
    - 任务总线 / 通知总线 / 命令面板 Ctrl+K
    - 功能包 SKU（feature_packs）/ 侧栏分组折叠 / 模块懒加载
    - 腾讯文档 / 钉钉对接槽占位
    - 图片套件：创建/调整/加水印/去水印框选/扫描件/图转文件/截图标注
    - OCR 工具页 / LLM 助手页（OpenAI 兼容）
  p1_next:
    - 关于页：检查新版本 + 一键升级（DMS 发布页/Setup 下载链）
    - 无感更新：后台检测、托盘提示、可选静默覆盖安装（单机 Inno 同 AppId）
    - 截图标注继续对齐微信能力（钉选/历史面板等）
    - 腾讯文档 OAuth 联调
    - 通用生成引擎加深（完整 generic_generator）
  p2:
    - 网络版：账号/配置云同步（可选）；部分数据 DMS 只读同步
    - 移动端伴侣：通知、日程只读、剪贴板接力（非全功能复刻）
    - 培训交付看板（环节+材料模板+进展）— 垂直场景，非通用 Jira
    - 插件化模块注册
    - 钉钉/企微通知实装
    - Windows toast

integrations_slots:
  ocr: 本地 Tesseract / 云端 OCR API
  llm: 摘要、改写、模板填充
  watermark_ai: 图像修复 / 去水印模型
  dms: 授权与台账
  email: SMTP 通知
  tencent_docs: 腾讯文档（占位）
  dingtalk: 钉钉通知（占位）
