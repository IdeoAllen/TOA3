# TOA3 产品定位（愿景公示 · UI 与文档同源）

vision:
  # 对外使命（首页 / 关于首屏 · 不是「口号」）
  tagline: 打开就能用 · 用完不想换
  mission_label: 使命
  # 愿景（我们要去哪）
  statement: 少点一下，多干一件事——把截图、记事、剪贴板与目录文件，收进同一处顺手工具。
  # 目标（我们要成为谁）
  goal: 成为办公室工作人员最爱、最方便、最离不开的桌面办公软件。
  # 集成定位（首页精简条）
  integration: 每个能力都对标市面同类工具；我们只是集成到一处，免去到处找——绝对不能比同类差，否则就是败笔。
  # 套件定位（安装叙事 · 与壳层规则同源）
  suite_positioning: 办公室人员安装本软件，即等于集成剪贴板、截图、目录、文件、桌面、业务等常用办公效率工具——一站替代多软件来回切换。
  # 命名
  naming_note: 对外以「运营宝 / TOA」示人；全称「运营宝 · 桌面办公套件」，气质是一站式办公效率，培训业务是加分能力而非唯一叙事。
  audience: 培训运营、教务、行政与通用白领
  promises:
    - 高频刚需做强，不做功能凑数；每项对标品类头部，宁少勿滥
    - 同类能力一站集成，少「到处找软件」
    - 小白拿来即用：极简路径享受便捷与高效，销售叙事一站式
    - 提供好用的工具，让用户自己轻松做出好看结果——不是预制内容堆观感
    - 记事：编辑/预览；组件库=标记全集；工具栏同源；无设计面；详 PROD-01 §0.5.1
    - 有技术门槛 / 有电脑条件时：软件引导探索；探索路径一件安装、配置 ≤2 步，步步有操作引导
    - 键位跟手、步骤尽量少
    - 本地优先、可离线，结果在本机可追溯
    - 截图、记事、剪贴板等日常动作一站直达
  principles:
    - 每个功能在市面上都能找到对应工具；TOA 做集成与一致体验，能力不输头部
    - 工具赋能，非内容预制：记事默认进编辑面；模板只作空白骨架
    - 记事：编辑/预览两面同一 Markdown；组件库=标记全集；工具栏同源；无设计面
    - 默认路径 = 傻瓜式可用；增强能力 = 引导式探索（不挡主路径）
    - 探索增强：一件安装 + 配置不超过 2 步；每一步有可见引导文案/按钮
    - 高频小工具聚合，减少「到处找软件」
    - 键位跟手：全局少而精，页内好记
    - 本地优先、可离线、数据在 data/output 可追溯
    - 三方能力经 integrations 统一接入
    - 业务页只从 widgets 控件库出 UI
    - 图标必须清晰：禁止模糊、锯齿（HiDPI 矢量光栅化规范）

# 首页展示（curated · 不随 app.yml 菜单整表渲染）
home:
  search_hint: 顶栏 ⌂ 或 Ctrl+K，关键字直达任一工作。
  advanced_note: 文生图、视频、Harness 等请到顶栏「引擎」或「系统设置 → 模型管理」；向导配置，无需手改文件。
  office_pins:
    - id: quick_notepad
      title: 快速记事
      subtitle: 编辑 / 预览 · 组件库=标记全集
    - id: screenshot_tool
      title: 截图工具
      subtitle: 区域 / 全屏
    - id: clipboard_history
      title: 剪贴板历史
      subtitle: Alt+Shift+C 速贴
    - id: quadrant_tasks
      title: 任务管理
      subtitle: 状态 · 日历 · 优先级
    - id: pomodoro
      title: 番茄钟
      subtitle: 沉浸专注
  suite_highlights:
    - id: directory_generator
      title: 目录生成
      subtitle: 粘贴名单建夹
    - id: pdf_toolkit
      title: PDF 工具
      subtitle: 合并拆分抽页
    - id: file_packager
      title: 打包归档
      subtitle: 规范命名 zip
    - id: column_preview
      title: 桌面浏览
      subtitle: 列式预览
    # Wave F 模块已露出；watermark_remover 仍在办公/图片线

module_groups:
  # 顶栏一级 = 子模块（子系统）；侧栏二级 = 功能模块（办公室场景）
  home: 首页与桌面浏览
  office: 日常办公（剪贴板、截图、记事、任务、大模型润色、网页）
  image: 图片处理与媒体生成（去水印、媒体工坊、扫描件、提取、格式转换）
  files: 文件与目录（建夹、透视、重命名、PDF、打包、合成）
  engines: 开源引擎（Harness、OpenPencil、Draw.io、ComfyUI 后台；可继续扩展）
  business: 培训业务（排课→材料→检核→交付）
  system: 系统与扩展

roadmap:
  p0_done:
    - 主壳 / 主题 / 控件库 / TOA License 授权 / 门禁 / 托盘 / 全局热键
    - 任务总线 / 通知总线（命令面板 Ctrl+K 为 P2）
    - 功能包 SKU（feature_packs · tiyan 全功能方案）/ 顶栏子模块 Tab / 模块懒加载
    - 腾讯文档 / 钉钉对接槽占位
    - 图片套件：调整/去水印框选/扫描件/图转文件/截图标注（日常加水印已降级）
    - OCR 工具页 / LLM 助手页（OpenAI 兼容）
  p1_next:
    - 关于页：检查新版本 + 一键升级（TOA Portal / Setup 下载链）
    - 无感更新：后台检测、托盘提示、可选静默覆盖安装（单机 Inno 同 AppId）
    - 截图标注继续对齐微信能力（钉选/历史面板等）
    - 腾讯文档 OAuth 联调
    - Wave F 文件四件套：directory_generator 点验 → pdf_toolkit → file_packager → batch_rename
    - 培训交付看板 training_delivery_board（高级付费锚点；串开班→交付；配合腾讯文档）
  p2:
    - 通用生成引擎加深（完整 generic_generator · 须先评估）
    - excel_cleaner（有强痛再 Top3）
    - 网络版：账号/配置云同步（可选）；与 DMS 仅弱耦合、非运行时依赖
    - 移动端伴侣：通知、日程只读、剪贴板接力（非全功能复刻）
    - 插件化模块注册加深
    - 钉钉/企微通知实装
    - Windows toast
    - Ctrl+K 命令面板

# 双产品（2026-09-07）：DMS=专业高门槛可售；TOA=免费钩子+高级付费；腾讯文档轻量轨；并行不强绑
integrations_slots:
  ocr: 本地 Tesseract / 云端 OCR API
  llm: 摘要、改写、模板填充
  watermark_ai: 图像修复 / 去水印模型
  toa_license: TOA 授权与发版（toa-service）
  dms: 专业运营培训系统（可售高门槛；非免费钩子；非 TOA 账本）
  email: SMTP 通知
  tencent_docs: 腾讯文档（轻量协作面；OAuth 分期）
  dingtalk: 钉钉通知（占位）
