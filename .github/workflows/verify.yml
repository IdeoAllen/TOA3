# TOA3 最小 CI：门禁子集（无 GUI 重压测）
name: verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  license-and-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          else { pip install PyYAML PySide6 }
      - name: License gate
        run: python scripts/verify_license_gate.py
      - name: Architecture audit
        run: python scripts/audit_architecture.py
      - name: Migration audit
        run: python scripts/audit_migration.py
      - name: Version align (skip CDN)
        run: python scripts/verify_version_align.py --skip-cdn
